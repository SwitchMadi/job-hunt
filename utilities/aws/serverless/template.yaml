  SaveJobPreferences:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SaveJobPreferences
      Handler: __init__.lambda_handler
      Runtime: python3.10
      CodeUri: /Users/bhaskar/Desktop/switchmadi/codebase/job-hunt/scripts/lambdas/save_job_preferences
