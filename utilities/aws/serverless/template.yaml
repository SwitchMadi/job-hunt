  UploadResume:
   Type: AWS::Serverless::Function
   Properties:
     FunctionName: UploadResume
     Handler: __init__.lambda_handler
     Runtime: python3.10
     CodeUri: /Users/bhaskar/Desktop/switchmadi/codebase/job-hunt/scripts/lambdas/upload_resume
