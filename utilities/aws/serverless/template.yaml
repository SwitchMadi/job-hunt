           Auth:
             Authorizer: LambdaTokenAuthorizer
       UploadResumeOptions:
         Type: Api
         Properties:
           RestApiId: !Ref JobHuntApi
           Path: /resume
           Method: OPTIONS

  WebSocketDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: ws.api.switchmadi.com
      DomainNameConfigurations:
        - CertificateArn: arn:aws:acm:ap-south-1:992382457904:certificate/874ba37b-96d8-464c-8c06-0fd92934c02f
          EndpointType: REGIONAL

  WebSocketApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      DomainName: !Ref WebSocketDomainName
