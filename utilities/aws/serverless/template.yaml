AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'

Globals:
  Api:
    Auth:
      Authorizers:
        LambdaTokenAuthorizer:
          FunctionArn: !GetAtt Authorization.Arn
          Identity:
            Header: Authorization

Resources:
  JobHuntCommonLayer:
    Type: 'AWS::Serverless::LayerVersion'
    Properties:
      LayerName: JobHuntCommonLayer
      ContentUri: /Users/bhaskar/Desktop/SharedLayer
      CompatibleRuntimes:
        - python3.10

  TriggerJobScrape:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: TriggerJobScrape
      Handler: __init__.lambda_handler
      Runtime: python3.10
      CodeUri: /Users/bhaskar/Desktop/switchmadi/codebase/job-hunt/scripts/lambdas/trigger_job_scrape
      Timeout: 900
      Layers:
        - !Ref JobHuntCommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OperationLocksTable
      Events:
        ScrapeUsaAnalystJobs:
          Type: Schedule
          Properties:
            Schedule: 'cron(30 7 * * ? *)'  # 1:00 PM IST daily
            Name: ScrapeUsaAnalystJobsTrigger
            Input: !Sub |
              {
                "ami_id": "ami-08b28ae49511d344b",
                "branch_name": "jobs_scraping/usa_analyst_jobs"
              }
        ScrapeGlobalBackendJobs:
          Type: Schedule
          Properties:
            Schedule: 'cron(30 12 * * ? *)'  # 6:00 PM IST daily
            Name: ScrapeGlobalBackendJobsTrigger
            Input: !Sub |
              {
                "ami_id": "ami-047d89b0be7dcf62e",
                "branch_name": "jobs_scraping/global_backend_jobs"
              }

  TriggerJobStepsIdentification:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: TriggerJobStepsIdentification
      Handler: __init__.lambda_handler
      Runtime: python3.10
      CodeUri: /Users/bhaskar/Desktop/switchmadi/codebase/job-hunt/scripts/lambdas/trigger_job_steps_identification
      Timeout: 900
      Layers:
        - !Ref JobHuntCommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OperationLocksTable
        - Statement:
            Effect: Allow
            Action:
              - ec2:RunInstances
              - ec2:CreateTags
              - ec2:DescribeInstances
              - ec2:DescribeImages
              - ec2:DescribeKeyPairs
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
              - iam:PassRole
            Resource: '*'
      Events:
        ScheduledEvent:
          Type: Schedule
          Properties:
            Schedule: 'rate(15 minutes)'  # Every 15 minutes
            Name: JobStepsIdentificationTrigger

  TriggerShareJobs:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: TriggerShareJobs
      Handler: __init__.lambda_handler
      Runtime: python3.10
      CodeUri: /Users/bhaskar/Desktop/switchmadi/codebase/job-hunt/scripts/lambdas/trigger_share_jobs
      Timeout: 900
      Layers:
        - !Ref JobHuntCommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OperationLocksTable
        - Statement:
            Effect: Allow
            Action:
              - ec2:RunInstances
              - ec2:CreateTags
              - ec2:DescribeInstances
              - ec2:DescribeImages
              - ec2:DescribeKeyPairs
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
              - iam:PassRole
            Resource: '*'
      Events:
        ScheduledEvent:
          Type: Schedule
          Properties:
            Schedule: 'cron(30 14 * * ? *)'  # 8 PM IST every day
            Name: TriggerShareJobsTrigger

  Authorization:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: Authorization
      Handler: __init__.lambda_handler
      Runtime: python3.10
      CodeUri: /Users/bhaskar/Desktop/switchmadi/codebase/job-hunt/scripts/lambdas/authorization
      Timeout: 900
      Layers:
        - !Ref JobHuntCommonLayer
      AutoPublishAlias: live
      ProvisionedConcurrencyConfig:
        ProvisionedConcurrentExecutions: 1

  # DynamoDB Table for WebSocket Connections
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: websocket-connections
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: UserIdTimeStampIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # DynamoDB Table for Operation Locks
  OperationLocksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: operation_locks
      AttributeDefinitions:
        - AttributeName: operation_name
          AttributeType: S
      KeySchema:
        - AttributeName: operation_name
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # WebSocket API
  ResumeParserWebSocket:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: ResumeParserWebSocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
      
  WebSocketAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref ResumeParserWebSocket
      AuthorizerType: REQUEST
      Name: LambdaTokenAuthorizer
      AuthorizerUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Authorization.Arn}/invocations
      IdentitySource: ['route.request.header.Sec-WebSocket-Protocol']
      # Permission for API Gateway to invoke authorizer
  WebSocketAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Authorization
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ResumeParserWebSocket}/authorizers/*

  # WebSocket Routes
  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ResumeParserWebSocket
      RouteKey: $connect
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref WebSocketAuthorizer
      Target: !Sub integrations/${WebSocketConnectIntegration}

  WebSocketConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ResumeParserWebSocket
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketConnect.Arn}/invocations
      IntegrationMethod: POST

  WebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ResumeParserWebSocket
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub integrations/${WebSocketDisconnectIntegration}

  WebSocketDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ResumeParserWebSocket
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketDisconnect.Arn}/invocations
      IntegrationMethod: POST

  # WebSocket Lambda Functions
  WebSocketConnect:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: WebSocketConnect
      Handler: __init__.lambda_handler
      Runtime: python3.10
      CodeUri: /Users/bhaskar/Desktop/switchmadi/codebase/job-hunt/scripts/lambdas/websocket_connect
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref ConnectionsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            Effect: Allow
            Action:
              - 'execute-api:ManageConnections'
            Resource:
              - !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ResumeParserWebSocket}/${ResumeParserWebSocketStage}/POST/@connections/*
              - !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ResumeParserWebSocket}/${ResumeParserWebSocketStage}/GET/@connections/*
              - !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ResumeParserWebSocket}/${ResumeParserWebSocketStage}/DELETE/@connections/*
      Layers:
        - !Ref JobHuntCommonLayer
      AutoPublishAlias: live
      ProvisionedConcurrencyConfig:
        ProvisionedConcurrentExecutions: 1

  WebSocketDisconnect:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: WebSocketDisconnect
      Handler: __init__.lambda_handler
      Runtime: python3.10
      CodeUri: /Users/bhaskar/Desktop/switchmadi/codebase/job-hunt/scripts/lambdas/websocket_disconnect
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref ConnectionsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            Effect: Allow
            Action:
              - 'execute-api:ManageConnections'
            Resource:
              - !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ResumeParserWebSocket}/${ResumeParserWebSocketStage}/POST/@connections/*
              - !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ResumeParserWebSocket}/${ResumeParserWebSocketStage}/GET/@connections/*
              - !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ResumeParserWebSocket}/${ResumeParserWebSocketStage}/DELETE/@connections/*
      Layers:
        - !Ref JobHuntCommonLayer

  ResumeParserWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ResumeParserWebSocket
      StageName: prod
      AutoDeploy: true

  JobHuntApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: JobHuntApi
      StageName: prod
      Domain:
        DomainName: api.switchmadi.com
        CertificateArn: arn:aws:acm:us-east-1:992382457904:certificate/8ecc1e74-c6fe-493e-8044-9474f906cac9
        EndpointConfiguration: EDGE

  WebhookApi:
