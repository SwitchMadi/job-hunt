AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'

Globals:
  Api:
    Auth:
      Authorizers:
        LambdaTokenAuthorizer:
          FunctionArn: !GetAtt Authorization.Arn
          Identity:
            Header: Authorization

Resources:
  JobHuntCommonLayer:
    Type: 'AWS::Serverless::LayerVersion'
    Properties:
      LayerName: JobHuntCommonLayer
      ContentUri: /Users/bhaskar/Desktop/SharedLayer
      CompatibleRuntimes:
        - python3.10

  TriggerJobScrape:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: TriggerJobScrape
      Handler: __init__.lambda_handler
      Runtime: python3.10
      CodeUri: /Users/bhaskar/Desktop/switchmadi/codebase/job-hunt/scripts/lambdas/trigger_job_scrape
      Timeout: 900
      Layers:
        - !Ref JobHuntCommonLayer
      Events:
        ScheduledEvent:
          Type: Schedule
          Properties:
            Schedule: 'cron(0 5 * * ? *)'  # 10:30 AM IST every day
            Name: JobScrapeTrigger

  ShareJobs:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: ShareJobs
      Handler: __init__.lambda_handler
      Runtime: python3.10
      CodeUri: /Users/bhaskar/Desktop/switchmadi/codebase/job-hunt/scripts/lambdas/share_jobs
      MemorySize: 1024
      Timeout: 900
      Layers:
        - !Ref JobHuntCommonLayer
      Events:
        ScheduledEvent:
          Type: Schedule
          Properties:
            Schedule: 'cron(30 14 * * ? *)'  # 8 PM IST every day
            Name: ShareJobsTrigger

  Authorization:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: Authorization
      Handler: __init__.lambda_handler
      Runtime: python3.10
      CodeUri: /Users/bhaskar/Desktop/switchmadi/codebase/job-hunt/scripts/lambdas/authorization
      Timeout: 900
      Layers:
        - !Ref JobHuntCommonLayer

  JobHuntApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: JobHuntApi
      StageName: prod
      Domain:
        DomainName: api.switchmadi.com
        CertificateArn: arn:aws:acm:us-east-1:992382457904:certificate/8ecc1e74-c6fe-493e-8044-9474f906cac9
        EndpointConfiguration: EDGE

  SaveUserTokens:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SaveUserTokens
      Handler: __init__.lambda_handler
      Runtime: python3.10
      CodeUri: /Users/bhaskar/Desktop/switchmadi/codebase/job-hunt/scripts/lambdas/save_user_tokens
      Timeout: 900
      Layers:
        - !Ref JobHuntCommonLayer
      Events:
        SaveTokensApi:
          Type: Api
          Properties:
            RestApiId: !Ref JobHuntApi
            Path: /init-channel
            Method: POST
            Auth:
              Authorizer: LambdaTokenAuthorizer

  PreferredJobsCount:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: PreferredJobsCount
      Handler: __init__.lambda_handler
      Runtime: python3.10
      CodeUri: /Users/bhaskar/Desktop/switchmadi/codebase/job-hunt/scripts/lambdas/preferred_jobs_count
      Timeout: 900
      Layers:
        - !Ref JobHuntCommonLayer
      Events:
        PreferredJobsApiGet:
          Type: Api
          Properties:
            RestApiId: !Ref JobHuntApi
            Path: /jobs/preferences/count
            Method: GET
            Auth:
              Authorizer: LambdaTokenAuthorizer
        PreferredJobsApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref JobHuntApi
            Path: /jobs/preferences/count
            Method: OPTIONS

  SaveJobPreferences:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SaveJobPreferences
      Handler: __init__.lambda_handler
      Runtime: python3.10
      CodeUri: /Users/bhaskar/Desktop/switchmadi/codebase/job-hunt/scripts/lambdas/save_job_preferences
      Timeout: 900
      Layers:
        - !Ref JobHuntCommonLayer
      Events:
        SaveJobPreferencesPost:
          Type: Api
          Properties:
            RestApiId: !Ref JobHuntApi
            Path: /jobs/preferences
            Method: POST
            Auth:
              Authorizer: LambdaTokenAuthorizer
        SaveJobPreferencesOptions:
          Type: Api
          Properties:
            RestApiId: !Ref JobHuntApi
            Path: /jobs/preferences
            Method: OPTIONS

  GetJobPreferences:
   Type: AWS::Serverless::Function
   Properties:
     FunctionName: GetJobPreferences
     Handler: __init__.lambda_handler
     Runtime: python3.10
     CodeUri: /Users/bhaskar/Desktop/switchmadi/codebase/job-hunt/scripts/lambdas/get_job_preferences
     Timeout: 900
     Layers:
       - !Ref JobHuntCommonLayer
     Events:
       GetJobPreferencesApiGet:
         Type: Api
         Properties:
           RestApiId: !Ref JobHuntApi
           Path: /jobs/preferences
           Method: GET
           Auth:
             Authorizer: LambdaTokenAuthorizer

  UploadResume:
   Type: AWS::Serverless::Function
   Properties:
     FunctionName: UploadResume
     Handler: __init__.lambda_handler
     Runtime: python3.10
     CodeUri: /Users/bhaskar/Desktop/switchmadi/codebase/job-hunt/scripts/lambdas/upload_resume
     Timeout: 900
     Layers:
       - !Ref JobHuntCommonLayer
     Events:
       UploadResumePost:
         Type: Api
         Properties:
           RestApiId: !Ref JobHuntApi
           Path: /resume
           Method: POST
           Auth:
             Authorizer: LambdaTokenAuthorizer
       UploadResumeOptions:
         Type: Api
         Properties:
           RestApiId: !Ref JobHuntApi
           Path: /resume
           Method: OPTIONS
  ParseResume:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ParseResume
      Handler: __init__.lambda_handler
      Runtime: python3.10
      CodeUri: /Users/bhaskar/Desktop/switchmadi/codebase/job-hunt/scripts/lambdas/parse_resume
      Timeout: 900
      Layers:
        - !Ref JobHuntCommonLayer
      Events:
        ParseResumePost:
          Type: Api
          Properties:
            RestApiId: !Ref JobHuntApi
            Path: /resume/parse
            Method: POST
            Auth:
              Authorizer: LambdaTokenAuthorizer
        ParseResumeOptions:
          Type: Api
          Properties:
            RestApiId: !Ref JobHuntApi
            Path: /resume/parse
            Method: OPTIONS