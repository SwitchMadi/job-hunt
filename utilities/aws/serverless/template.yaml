            Resource:
              - !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ResumeParserWebSocket}/${ResumeParserWebSocketStage}/POST/@connections/*
              - !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ResumeParserWebSocket}/${ResumeParserWebSocketStage}/GET/@connections/*
